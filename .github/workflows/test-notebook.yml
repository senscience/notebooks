# Runs the notebook of a dataset from scratch, as on a first visit, with the test-notebook action of
# fair2-sdk: the summary (time, downloads, errors...) is on the run's page, the report and the
# executed notebook in an artifact. Started by hand: Actions > Test a notebook > Run workflow.
#
# The same file in each environment's notebooks repository. The action follows fair2-sdk's main
# for now (its latest notebook-runner), until fair2-sdk has releases to pin it to.
name: Test a notebook

on:
  workflow_dispatch:
    inputs:
      doi:
        description: "Dataset DOI, e.g. 10.71728/senscience.qs2f-h81p"
        required: true
        type: string
      notebook:
        description: "Notebook file in the dataset's folder"
        default: notebook.ipynb
        type: string
      branch-patch:
        description: "Use this branch's patch_fair2 instead of the one the notebook downloads"
        default: true
        type: boolean
      skip-cells:
        description: "Comma-separated ids of cells not to run (e.g. a widget needing a browser)"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.doi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: senscience/fair2-sdk/.github/actions/test-notebook@main
        with:
          doi: ${{ inputs.doi }}
          notebook: ${{ inputs.notebook }}
          branch-patch: ${{ inputs.branch-patch }}
          skip-cells: ${{ inputs.skip-cells }}
