# Runs the notebooks of datasets from scratch, as on a first visit, one after the other, with the
# test-notebook action of fair2-sdk, on Linux, macOS, Windows or all three: the summary (time,
# downloads, errors...) is on the run's page, the reports and the executed notebooks in an artifact,
# one per system. Started by hand: Actions > Test notebooks > Run workflow; the notebooks of any
# branch, tag or commit (ref), with the workflow of the branch it runs from (main).
#
# The same file in each environment's notebooks repository. The action follows fair2-sdk's main
# for now (its latest notebook-runner), until fair2-sdk has releases to pin it to.
name: Test notebooks
# The DOIs can be many: in the summary, not in the names of the run and the job
run-name: Test notebooks on ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      doi:
        description: "Dataset DOI, e.g. 10.71728/senscience.qs2f-h81p, or several separated by spaces"
        required: true
        type: string
      ref:
        description: "Branch, tag or commit of the notebooks (empty: the branch the workflow runs from)"
        default: ""
        type: string
      notebook:
        description: "Notebook file in each dataset's folder"
        default: notebook.ipynb
        type: string
      branch-patch:
        description: "Use the tested branch's patch_fair2 instead of the one the notebooks download"
        default: true
        type: boolean
      skip-cells:
        description: "Comma-separated ids of cells not to run (with a single DOI)"
        default: ""
        type: string
      os:
        description: "System of the runner"
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - all

permissions:
  contents: read

jobs:
  test:
    name: Test the notebooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The notebooks run one after the other, each one in about a minute (two or three on Windows)
    timeout-minutes: 60
    strategy:
      # Each system to the end, to see all their failures at once
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The notebooks (and tools/patch_fair2.py) to test; empty: the workflow's branch
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: senscience/fair2-sdk/.github/actions/test-notebook@main
        with:
          doi: ${{ inputs.doi }}
          notebook: ${{ inputs.notebook }}
          branch-patch: ${{ inputs.branch-patch }}
          skip-cells: ${{ inputs.skip-cells }}
          # One per system: their names must differ within a run
          artifact-name: notebook-run-${{ matrix.os }}
